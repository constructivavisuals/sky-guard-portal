# go2rtc pro PŘEHRÁVÁNÍ ZE ZÁZNAMU — ne pro živý obraz.
#
# Proudy tu schválně žádné nejsou: zakládá je sky-playback za běhu
# přes API, pokaždé když si někdo s platným lístkem řekne o konkrétní
# čas. Seznam kamer se sem tedy negeneruje a tenhle soubor se nemění.
#
# ═══ Proč vlastní instance ═════════════════════════════════════════
# Ta od živého obrazu se restartuje při každé změně seznamu kamer
# (live.py → /api/restart) a restart utne všechna běžící spojení.
# U živého obrazu je to vteřina bez obrazu, u přehrávání konec sezení.

api:
  # Ven se nepublikuje; chodí se sem jedině přes Caddy, který ověří
  # lístek. Administrace go2rtc umí přidat proud z libovolné adresy.
  listen: ":1984"

rtsp:
  # ═══ Zapnuto, a jen na smyčce ════════════════════════════════════
  # Tady se to liší od instance pro živý obraz, kde je RTSP vypnuté —
  # a NENÍ to nedopatření, které by se mělo srovnat.
  #
  # Živý obraz bere proudy nativním RTSP klientem, takže server
  # nepotřebuje. Přehrávání jde přes `ffmpeg:` zdroj a ten si výstup
  # z ffmpegu předává zpátky do go2rtc PRÁVĚ TÍMHLE serverem:
  #
  #     if rtsp.Port == "" { return nil, errors.New("exec: rtsp module disabled") }
  #     rawURL = "rtsp://127.0.0.1:" + rtsp.Port + path + ...
  #
  # Bez něj se proud založí, websocket naváže a přijde
  #     {"type":"error","value":"mse: streams: exec: rtsp module disabled"}
  #
  # Adresu si go2rtc skládá na 127.0.0.1 natvrdo, takže vazba na
  # smyčku stačí — ffmpeg běží ve stejném kontejneru. Ven se tím
  # neotevírá nic: ani do sítě kontejnerů, natož na veřejnou adresu.
  listen: "127.0.0.1:8554"

webrtc:
  listen: ""

ffmpeg:
  # ═══ Vlastní vstupní šablona: vynucené TCP ═══════════════════════
  # Výchozí šablona `rtsp` v go2rtc má `-rtsp_flags prefer_tcp`, což
  # TCP jen PREFERUJE — při potížích spadne na UDP. Změřeno na místě,
  # že UDP se přes tunel rozpadá (ztracený paket se neopakuje), takže
  # „preferovat" nestačí a musí se vynutit.
  #
  # Zbytek je opsaný z výchozí šablony `rtsp` TÉHLE VERZE go2rtc
  # schválně, ať se neztratí: `-timeout` je to, co odpojí mrtvou
  # kameru místo věčného čekání.
  #
  # ═══ Číslo, ne {timeout} ═════════════════════════════════════════
  # go2rtc 1.9.9 dosazuje ve vlastních šablonách JEDINÉ `{input}`:
  #
  #     return strings.Replace(template, "{input}", s, 1)
  #
  # Zástupné `{timeout}` je až z pozdějších verzí a ve vestavěné
  # šabloně 1.9.9 je taky natvrdo `5000000`. Kdyby se sem opsalo
  # z novější dokumentace, dojde do ffmpegu doslova a ten spadne na
  # „Error setting option timeout to value {timeout}".
  #
  # Proto tu žádná jiná zástupná hodnota než `{input}` být nesmí.
  # Hlídá to kontrola při startu v playback.py.
  #
  # Hodnota je v mikrosekundách, tedy 5 s — shodně s vestavěnou
  # šablonou. Kdyby se ukázalo, že hledání na kartě trvá déle, je to
  # číslo, které se zvedá.
  #
  # ═══ Pojmenovaná šablona, ne `#input=` v adrese ══════════════════
  # Zdroj pak nemá mezery ani složené závorky, které se při dvojím
  # průchodu kódováním (jednou do API, podruhé při rozboru `#`
  # parametrů) můžou rozejít. V adrese zbyde `#input=playback`
  # a je to čitelné i v logu.
  playback: "-fflags nobuffer -flags low_delay -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_transport tcp -i {input}"

log:
  level: info

streams:
