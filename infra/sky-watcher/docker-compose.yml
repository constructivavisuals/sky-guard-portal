# Sky Guard watcher — běží VEDLE cam-relay Constructivy, ne místo něj.
#
# Vlastní adresář a vlastní compose projekt schválně: dvě repozitáře,
# které by si nasazovaly do jednoho /opt/cam-relay, by si navzájem
# přepisovaly soubory. Sdílí se jen inbox, a to jako svazek.

services:
  sky-watcher:
    build: .
    container_name: sky-watcher
    restart: unless-stopped
    env_file: .env
    volumes:
      # Inbox patří relayi Constructivy — tenhle watcher z něj bere
      # výhradně .dav a maže jen ty. Prázdné adresáře uklízí ten druhý.
      - /opt/cam-relay/ftp-inbox:/inbox
      # Vlastní karanténa: soubor, který neprošel, nemá skončit v cizí.
      - ./failed:/failed
    environment:
      INBOX_DIR: /inbox
      FAILED_DIR: /failed

  # Události ze stavebních kamer: detekce člověka v reálném čase.
  #
  # Vlastní služba schválně. Watcher chodí po adresáři a přebírá hotové
  # soubory, tohle visí na spojení a čeká — a hlavně: záznam, který
  # dorazí o dvě minuty později, nikoho nebolí, kdežto detekce ano.
  sky-events:
    build: .
    container_name: sky-events
    restart: unless-stopped
    env_file: .env
    command: /app/events.py
    # Bez svazků: k FTP inboxu ani k úložišti tahle služba nemá co mít.
    # Mluví jen s kamerami v LAN a s portálem.
