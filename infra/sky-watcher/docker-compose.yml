# Sky Guard watcher — běží VEDLE cam-relay Constructivy, ne místo něj.
#
# Vlastní adresář a vlastní compose projekt schválně: dvě repozitáře,
# které by si nasazovaly do jednoho /opt/cam-relay, by si navzájem
# přepisovaly soubory. Sdílí se jen inbox, a to jako svazek.

services:
  sky-watcher:
    build: .
    container_name: sky-watcher
    restart: unless-stopped
    env_file: .env
    volumes:
      # Inbox patří relayi Constructivy — tenhle watcher z něj bere
      # výhradně .dav a maže jen ty. Prázdné adresáře uklízí ten druhý.
      - /opt/cam-relay/ftp-inbox:/inbox
      # Vlastní karanténa: soubor, který neprošel, nemá skončit v cizí.
      - ./failed:/failed
    environment:
      INBOX_DIR: /inbox
      FAILED_DIR: /failed

  # Události ze stavebních kamer: detekce člověka v reálném čase.
  #
  # Vlastní služba schválně. Watcher chodí po adresáři a přebírá hotové
  # soubory, tohle visí na spojení a čeká — a hlavně: záznam, který
  # dorazí o dvě minuty později, nikoho nebolí, kdežto detekce ano.
  sky-events:
    build: .
    container_name: sky-events
    restart: unless-stopped
    env_file: .env
    command: /app/events.py
    volumes:
      # Jediný svazek: fronta úkolů na klipy. K úložišti tahle služba
      # pořád nemá co mít — jen sem POLOŽÍ lístek papíru, že se něco
      # stalo, a video z něj vyrobí sky-klipy.
      #
      # POJMENOVANÝ svazek, ne cesta na hostiteli: ten si převezme
      # vlastníka z obrazu, kde je adresář založený pod `watcher`.
      # Vazba na hostitele by se vyrobila jako `root` a kontejner
      # pod uid 10001 by do ní nezapsal — služba by běžela, detekce
      # chodily a klipy nevznikaly. Nikdo tu frontu z hostitele
      # číst nepotřebuje; je to vnitřní stav dvou služeb.
      - klipy-fronta:/fronta
    environment:
      KLIPY_FRONTA_DIR: /fronta

  # ── Klipy kolem detekcí ──────────────────────────────────────────
  #
  # To JEDINÉ, co se ukládá do Hetzneru. Průběžný archiv je na SD kartě
  # v kameře; tady se vyrábí důkaz, který přežije i krádež kamery.
  #
  # Vlastní služba, ne součást sky-events: stažení klipu z karty trvá
  # přes minutu a po tu dobu nesmí nikdo přestat poslouchat události.
  sky-klipy:
    build: .
    container_name: sky-klipy
    restart: unless-stopped
    env_file: .env
    command: /app/klipy.py
    volumes:
      # Pojmenované, ze stejného důvodu jako u sky-events výš.
      # Do karantény se kouká přes `docker compose exec`.
      - klipy-fronta:/fronta
      - klipy-failed:/failed-klipy
    environment:
      KLIPY_FRONTA_DIR: /fronta
      KLIPY_FAILED_DIR: /failed-klipy

  # ── Živý obraz ───────────────────────────────────────────────────
  #
  # Tři služby, protože každá dělá něco jiného a padat mají zvlášť:
  # go2rtc sahá na kamery, sky-live rozhoduje o přístupu a Caddy drží
  # TLS. Kdyby to byl jeden proces, znamenal by pád převodu obrazu
  # i to, že nikdo neověří lístek.

  # Převod RTSP na něco, co umí prohlížeč.
  #
  # Port se NEPUBLIKUJE: go2rtc má webové rozhraní, kterým jde přidat
  # proud z libovolné adresy. Ven se chodí jedině přes Caddy, který
  # pustí tři cesty a zbytek odmítne.
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    container_name: sky-go2rtc
    restart: unless-stopped
    volumes:
      # Konfigurák sem skládá sky-live podle seznamu kamer z portálu.
      - ./live-config:/config

  # ── Přehrávání ze SD karty ───────────────────────────────────────
  #
  # VLASTNÍ instance go2rtc, ne ta výš. Ta se restartuje při každé
  # změně seznamu kamer a restart by utnul každé běžící přehrávání.
  #
  # Konfigurák je statický a prázdný: proudy sem zakládá sky-playback
  # za běhu, pokaždé na jeden konkrétní čas.
  go2rtc-playback:
    image: alexxit/go2rtc:1.9.9
    container_name: sky-go2rtc-playback
    restart: unless-stopped
    volumes:
      - ./playback-config:/config

  # Vrátný přehrávání: ověří lístek a založí proud z karty.
  sky-playback:
    build: .
    container_name: sky-playback
    restart: unless-stopped
    env_file: .env
    command: /app/playback.py
    environment:
      PLAYBACK_GO2RTC_API: http://go2rtc-playback:1984

  # Ověřování lístků a generování konfigurace go2rtc.
  sky-live:
    build: .
    container_name: sky-live
    restart: unless-stopped
    env_file: .env
    command: /app/live.py
    volumes:
      - ./live-config:/config
    environment:
      GO2RTC_CONFIG: /config/go2rtc.yaml
      GO2RTC_API: http://go2rtc:1984

  # Dveřník před go2rtc. TLS ani porty NEVLASTNÍ — viz Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: sky-caddy
    restart: unless-stopped
    env_file: .env
    # Bez publikovaných 80 a 443: ty má Caddy Constructivy. Na smyčku
    # se publikuje jen kvůli tomu, aby šlo z VPS ověřit, že tenhle
    # kontejner odpovídá, aniž by se muselo přes veřejnou adresu:
    #
    #   curl -i -H 'Host: kamery.sky-guard.cz' http://127.0.0.1:8880/zdravi
    #
    # Zvenčí je to nedostupné — 127.0.0.1 se neroutuje.
    ports:
      - "127.0.0.1:8880:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default
      # Sem dosáhne Caddy Constructivy. Certifikáty se tu nedrží —
      # TLS končí u něj.
      - edge

volumes:
  # Vnitřní stav služeb klipů. Pojmenované, ne cesty na hostiteli —
  # viz poznámka u sky-events.
  klipy-fronta:
  klipy-failed:

networks:
  # Jediné místo, kde se ty dva systémy potkávají.
  #
  # `external` na OBOU stranách schválně: síť se zakládá jednou, ručně,
  #
  #     docker network create sky-guard-edge
  #
  # a nepatří ani jednomu compose projektu. Kdyby ji zakládal tenhle,
  # nenaběhla by Constructiva, dokud neběží Sky Guard — a naopak. Takhle
  # na sobě ty dva systémy nezávisí; chybí-li síť, řeknou to oba hlasitě
  # při nasazení, ne v noci.
  edge:
    name: sky-guard-edge
    external: true
